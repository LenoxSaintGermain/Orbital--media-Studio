steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orbital-studio:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orbital-studio:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - orbital-studio
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orbital-studio:latest
      - --region
      - europe-west1
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orbital-studio:latest

options:
  logging: CLOUD_LOGGING_ONLY
