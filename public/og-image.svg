<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2410C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#171717"/>
  
  <!-- Subtle Glow -->
  <circle cx="600" cy="315" r="500" fill="#F97316" fill-opacity="0.03" filter="url(#glow)"/>
  
  <!-- Logo Container -->
  <rect x="536" y="160" width="128" height="128" rx="28" fill="url(#grad1)" />
  
  <!-- Logo Text 'O' -->
  <text x="600" y="252" font-family="'Plus Jakarta Sans', sans-serif" font-size="84" font-weight="bold" fill="white" text-anchor="middle">O</text>
  
  <!-- Main Title -->
  <text x="600" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-1">Orbital Studio</text>
  
  <!-- Tagline -->
  <text x="600" y="450" font-family="'Inter', sans-serif" font-size="32" fill="#A3A3A3" text-anchor="middle">AI-Native Creative Studio for Narrative & Visual IP</text>
  
</svg>